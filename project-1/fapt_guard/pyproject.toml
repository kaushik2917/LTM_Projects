[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fapt-guard"
version = "0.1.0"
description = "FAPT-Guard: Forensic-Aware Predictive Threat Guard - a research framework for real-time prediction and prevention of cyberattacks with digital evidence analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Research use" }
dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4"]
deep = ["torch>=2.2"]
dashboard = ["streamlit>=1.32", "plotly>=5.18", "pandas>=2.1"]
neo4j = ["neo4j>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
